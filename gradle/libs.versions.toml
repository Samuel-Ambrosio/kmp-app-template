[versions]
#Project
android-compileSdk = "37"
android-minSdk = "26"
android-targetSdk = "37"
jvmTarget = "25"

#Gradle
androidGradlePlugin = "9.5.2"
versionsGradlePlugin = "0.67.0"
crashlyticsGradlePlugin = "3.0.8"
googleServicesGradlePlugin = "4.6.0"
detekt = "2.0.0-alpha.6"
buildKonfig = "0.24.1"

#Kotlin
kotlin = "2.4.21"
kotlinCoroutines = "1.11.0"
kotlinSerialization = "1.13.0"
kotlinDatetime = "0.8.0"
ksp = "2.3.14"

#Android
desugarJdkLibs = "2.1.5"
androidxActivity = "1.13.0"
androidxCore = "1.19.1"
splashScreen = "1.2.0"

#Compose Multiplatform
composeMultiplatform = "1.12.2"
material3 = "1.12.0-alpha03"
lifecycle = "2.11.0"
navigation3 = "1.2.0"

#Data
ktor = "3.6.1"
room = "2.8.5"
sqlite = "2.7.1"
dataStore = "1.3.0"

#Other
koin = "4.2.2"
kermit = "2.2.0"
firebaseBom = "35.2.0"
playServicesAds = "25.4.0"

#Test
junit = "4.13.2"
androidxTestRunner = "1.7.0"
androidxEspresso = "3.7.0"
androidxComposeUiTest = "1.12.1"
robolectric = "4.18.1"
roborazzi = "1.79.0"
turbine = "1.2.1"

[libraries]
#Kotlin
kotlin-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinCoroutines" }
kotlin-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinCoroutines" }
kotlin-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinSerialization" }
kotlin-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinSerialization" }
kotlin-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinDatetime" }

#Android
android-desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
