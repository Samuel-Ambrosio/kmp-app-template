#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx6144M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# ---------------------------------------------------------------------------------------------
# App identity. The only place to change when creating a new app from this template.
#   app.name           Display name on every platform: Android launcher label, iOS home screen
#                      (CFBundleDisplayName), desktop window and installer, web page title.
#                      The Gradle root project and the iOS PRODUCT_NAME take it without whitespace.
#   app.applicationId  Android applicationId, iOS bundle identifier and desktop package id.
#                      Must match the ids registered in Firebase / App Store Connect / Play Console.
#   app.versionName    Semantic version (MAJOR.MINOR.PATCH, MAJOR > 0: required by the macOS installer).
#   app.versionCode    Integer build number (Android versionCode, iOS CURRENT_PROJECT_VERSION).
# After changing them, run `./gradlew syncAppIdentity` once so Xcode picks them up
# (iosApp/Configuration/Identity.xcconfig is generated from these values).
# ---------------------------------------------------------------------------------------------
app.name=KMP App Template
app.applicationId=com.samuelav.kmpapptemplate
app.versionName=1.0.0
app.versionCode=1

# Backend environment compiled into the shared code: dev | pre | pro.
# Override per build with -Pbuildkonfig.flavor=pro (see build-logic/.../convention.kmp.environment.gradle.kts).
buildkonfig.flavor=dev

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
